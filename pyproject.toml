[project]
name = "vacancy-radar"
version = "0.1.0"
description = "IT job aggregator with market analytics and Telegram subscription alerts."
authors = [{ name = "Biloshitsky Ivan" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "celery[redis]>=5.7.0",
    "fastapi>=0.162.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.8",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "DTZ",   # naive datetimes
    "PT",    # pytest style
    "ASYNC", # blocking calls in async code
    "S",     # bandit security checks
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["vacancy_radar", "tests"]

[tool.ruff.lint.per-file-ignores]
# Vacancy texts are Ukrainian and use typographic dashes, so parsers and their
# tests are full of Cyrillic letters and en dashes that RUF001-003 flag as
# look-alikes of ASCII characters.
"src/vacancy_radar/domain/**" = ["RUF001", "RUF002", "RUF003"]
"tests/**" = [
    "S101",   # assert is how pytest works
    "S105",   # test accounts have fixed passwords, keys and tokens on purpose
    "S106",
    "S107",
    "RUF001", # see domain/ above
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations", "scripts"]
# Map files to modules from these roots, so `tests/support.py` is `tests.support`.
mypy_path = ["src"]
explicit_package_bases = true

# feedparser ships no type hints. Its output is wrapped into typed `RawItem`s
# in the adapter, so `Any` does not leak further.
[[tool.mypy.overrides]]
module = ["feedparser", "feedparser.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["vacancy_radar"]
branch = true
# SQLAlchemy's async engine runs database calls in greenlets, and code after
# them is reported as missed unless coverage follows greenlets too.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
skip_covered = true

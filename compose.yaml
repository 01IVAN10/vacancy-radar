# Local development stack. Production gets its own Compose file in stage 11.
# Ports are bound to 127.0.0.1 so nothing is exposed beyond this machine.

x-app: &app
  build: .
  image: vacancy-radar:dev
  env_file:
    - path: .env
      required: false
  environment:
    # Inside the Compose network the services are not on localhost.
    DATABASE_URL: postgresql+psycopg://vacancy_radar:vacancy_radar@postgres:5432/vacancy_radar
    REDIS_URL: redis://redis:6379/0
    # DOU is collected into Neon by GitHub Actions until the VPS exists
    # (stage 11). A second collector here would break DOU's consent limit of
    # one request per 30 minutes, because this database cannot see those runs.
    DISABLED_SOURCES: dou
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  api:
    <<: *app
    command: ["uvicorn", "vacancy_radar.api.app:app", "--host", "0.0.0.0", "--port", "8000",
              "--reload", "--reload-dir", "/app/src"]
    environment:
      DATABASE_URL: postgresql+psycopg://vacancy_radar:vacancy_radar@postgres:5432/vacancy_radar
      REDIS_URL: redis://redis:6379/0
      # A fixed key, so sessions survive restarts. Never reuse it outside this stack.
      SECRET_KEY: local-development-only-not-a-secret-000000
      # Run the mounted source instead of the copy installed in the image.
      PYTHONPATH: /app/src
    volumes:
      - ./src:/app/src:ro
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *app
    command: ["celery", "-A", "vacancy_radar.worker", "worker", "--loglevel=INFO"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A vacancy_radar.worker inspect ping --timeout 5"]
      interval: 30s
      timeout: 10s
      start_period: 15s

  beat:
    <<: *app
    # Keep the schedule state file in /tmp: the image's /app is not writable by the app user.
    command: ["celery", "-A", "vacancy_radar.worker", "beat", "--loglevel=INFO",
              "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true

  bot:
    <<: *app
    command: ["python", "-m", "vacancy_radar.telegram"]
    # Without TELEGRAM_BOT_TOKEN the bot exits with 0 and stays down.
    restart: on-failure
    # Long polls last up to 20 s; let the current one finish on `docker compose stop`.
    stop_grace_period: 30s
    # The image's check calls the API's /health, which this service does not serve.
    healthcheck:
      disable: true

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vacancy_radar
      POSTGRES_PASSWORD: vacancy_radar
      POSTGRES_DB: vacancy_radar
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vacancy_radar -d vacancy_radar"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:

# Alembic configuration. The database URL is not set here: migrations/env.py
# reads DATABASE_URL from the application settings.

[alembic]
script_location = %(here)s/migrations
# Sortable, readable names: 0001_create_source_and_raw_vacancy.py
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# Generated migrations go through the same lint and format as the rest of the code.
hooks = ruff_check, ruff_format
ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

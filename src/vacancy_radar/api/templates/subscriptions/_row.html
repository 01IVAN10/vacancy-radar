{% set subscription = row.subscription %}
<tr id="subscription-{{ subscription.id }}">
  <td>
    <a href="/subscriptions/{{ subscription.id }}/edit">{{ subscription.name }}</a><br>
    <small>{{ row.criteria | join(" · ") }}</small>
  </td>
  <td>{% if subscription.is_active %}Active{% else %}<mark>Paused</mark>{% endif %}</td>
  <td class="actions">
    <form method="post" action="/subscriptions/{{ subscription.id }}/toggle" class="inline"
          hx-post="/subscriptions/{{ subscription.id }}/toggle"
          hx-target="closest tr" hx-swap="outerHTML">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="secondary outline">
        {% if subscription.is_active %}Pause{% else %}Resume{% endif %}
      </button>
    </form>
    <form method="post" action="/subscriptions/{{ subscription.id }}/delete" class="inline"
          hx-post="/subscriptions/{{ subscription.id }}/delete"
          hx-target="closest tr" hx-swap="outerHTML"
          hx-confirm="Delete “{{ subscription.name }}”?">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="secondary outline">Delete</button>
    </form>
  </td>
</tr>
